<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The House of Letters</title>

    <style>
        body{
            margin:0;
            background:#111;
            color:#f5f1e8;
            font-family:Georgia, serif;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
            text-align:center;
        }

        h1{
            font-size:60px;
            margin-bottom:15px;
        }

        p{
            font-size:22px;
            color:#d9d1c2;
        }

        button{
            margin-top:40px;
            padding:15px 35px;
            font-size:18px;

            border:none;
            cursor:pointer;

            background:#f5f1e8;
            color:#111;

            border-radius:40px;
        }

        button:hover{
            transform:scale(1.05);
        }
    </style>
</head>

<body>

<div>

<h1>The House of Letters</h1>

<p>
A place built from ink,<br>
memory, and love.
</p>

<button>Open the Door</button>

</div>

</body>

</html>
