<!DOCTYPE html>

<head>

    <title>The House of Letters</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="cover">

        <div class="candle-glow"></div>

        <section class="book-cover">

            <p class="small-title">

            </button>

        </section>

    </main>


    <script src="script.js"></script>

</html>
